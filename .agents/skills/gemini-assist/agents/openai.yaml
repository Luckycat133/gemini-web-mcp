interface:
  display_name: "Gemini Assist"
  short_description: "Extend an agent with Gemini second opinions, grounded search, and multimodal understanding."
  default_prompt: "Use $gemini-assist only for assistance intents: a second opinion, critique, code or design review, grounded current-web search, image or screenshot understanding, mixed file/URL understanding, or Deep Research. Start the focused server with uvx --from git+https://github.com/Luckycat133/gemini-web-mcp@main gemini-mcp-assist, pick exactly one of gemini_ask, gemini_search, gemini_understand_image, gemini_understand, or gemini_research, read the structured result, and continue the user's task with the returned information. Do not use it for pure generation, Gemini account administration, or repository development."
