interface:
  display_name: "Gemini Assist"
  short_description: "Extend an agent with Gemini second opinions, grounded search, and multimodal understanding."
  default_prompt: "Use $gemini-assist only for assistance intents: a second opinion, critique, code or design review, current-web search that names its sources, image or screenshot understanding, mixed file/URL understanding, or Deep Research. Prefer gemini_ask on the default function server for chat and current-web requests. The assist compatibility server can be started with uvx --from git+https://github.com/Luckycat133/gemini-web-mcp@main gemini-mcp-assist and retains gemini_ask, gemini_search, gemini_understand_image, gemini_understand, and gemini_research. Read the structured result and continue the user's task with the returned information. Do not use it for pure generation, Gemini account administration, or repository development."
