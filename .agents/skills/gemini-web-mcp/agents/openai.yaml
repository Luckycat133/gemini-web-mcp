interface:
  display_name: "Gemini Web MCP"
  short_description: "Extend an agent with Gemini assistance, multimodal creation, and explicit account workflows."
  default_prompt: "Use $gemini-web-mcp to choose the next Gemini capability the user's task needs. Prefer gemini-mcp-assist for assistance, search, understanding, and Research; use the compact compatibility server for image/music and explicit account work, or a narrow primary profile when its controls or local files are needed. Use Gemini's dedicated Videos page for video. If MCP tools are unavailable, follow the connection recovery steps. Inspect structured results, use returned files in the user's task, and use the manifest only for discovery or recovery."
