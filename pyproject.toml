[project]
name = "gemini-mcp-server"
version = "0.2.1"
description = "MCP server for Gemini Web API reverse engineering"
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Gemini MCP Server Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "gemini-webapi>=2.0.0,<3",
    "mcp>=2.0.0,<3",
    "mcp-types>=2.0.0,<3",
    "orjson>=3.11.7,<4",
]

[project.optional-dependencies]
browser = ["browser-cookie3>=0.19.0,<1"]
image = ["pillow>=10.0.0,<13"]
all = ["browser-cookie3>=0.19.0,<1", "pillow>=10.0.0,<13"]
dev = [
    "build>=1.2.0",
    "jsonschema>=4.0.0,<5",
    "mypy>=2.0.0,<3",
    "pytest>=8.0.0",
    "ruff>=0.16.0,<1",
]

[project.scripts]
gemini-mcp-server = "src.server:main"
gemini-mcp-skill-server = "src.skill_server:main"
gemini-mcp-onboarding = "src.onboarding:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start with correctness rules that the existing tree can enforce without a
# broad behavior-neutral rewrite. Style/modernization families can be enabled
# incrementally in dedicated maintenance changes.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Third-party dependencies that ship no py.typed marker nor PEP 561 stubs.
module = ["gemini_webapi.*", "browser_cookie3"]
ignore_missing_imports = true
