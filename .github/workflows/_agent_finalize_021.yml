name: Finalize 0.2.1 release branch

on:
  push:
    branches:
      - agent/refresh-development-skill-current-state

permissions:
  contents: write

env:
  GEMINI_AUTO_REFRESH: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip finalize-021]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: agent/refresh-development-skill-current-state
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply owner decisions and 0.2.1 version
        run: python scripts/_agent_finalize_021.py
      - name: Validate version and Skill contracts
        run: |
          python -m pip install --upgrade pip pytest
          python scripts/check_version_consistency.py
          python -m py_compile scripts/check_version_consistency.py tests/test_development_skill.py tests/test_skill_packaging.py
          python -m pytest -q tests/test_development_skill.py tests/test_skill_packaging.py
          git diff --check
      - name: Commit final release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): prepare v0.2.1 and settle roadmap [skip finalize-021]"
          git push origin HEAD:agent/refresh-development-skill-current-state
