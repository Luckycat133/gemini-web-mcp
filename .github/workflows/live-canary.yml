name: Live Gemini Web compatibility canary

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Confirm this run may use the configured dedicated Gemini test account
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read
  issues: write

concurrency:
  group: gemini-web-live-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Dedicated-account capability probes
    if: >-
      vars.GEMINI_LIVE_CANARY_ENABLED == 'true' &&
      vars.GEMINI_LIVE_CANARY_DEDICATED_ACCOUNT == 'true' &&
      (github.event_name == 'schedule' || inputs.run_live == true)
    environment: gemini-live-canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_AUTO_REFRESH: "false"
      GEMINI_LIVE_CANARY_ENABLED: ${{ vars.GEMINI_LIVE_CANARY_ENABLED }}
      GEMINI_LIVE_CANARY_DEDICATED_ACCOUNT: ${{ vars.GEMINI_LIVE_CANARY_DEDICATED_ACCOUNT }}
      GEMINI_PSID: ${{ secrets.GEMINI_PSID }}
      GEMINI_PSIDTS: ${{ secrets.GEMINI_PSIDTS }}
      GEMINI_PSIDCC: ${{ secrets.GEMINI_PSIDCC }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      REPORT_PATH: ${{ github.workspace }}/gemini-web-live-canary.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the supported runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Run sanitized read-only capability canary
        id: canary
        continue-on-error: true
        run: >-
          python scripts/run_live_canary.py
          --allow-live-account
          --output "$REPORT_PATH"
          --summary "$GITHUB_STEP_SUMMARY"
          --repository-commit "$GITHUB_SHA"
      - name: Upload sanitized diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gemini-web-live-canary-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 14
      - name: Open, update, or resolve compatibility issue
        if: always()
        uses: actions/github-script@v9
        env:
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
        with:
          script: |
            const fs = require("fs");
            const title = "[live-canary] Gemini Web compatibility drift";
            let report;
            try {
              report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            } catch (error) {
              report = {
                status: "failed",
                repository_commit: context.sha,
                web: {},
                dependencies: {},
                summary: {},
                capabilities: [],
                failure: {stage: "report", error_code: "REPORT_UNAVAILABLE"},
              };
            }

            const actionable = ["drift", "failed", "not_run"].includes(report.status);
            const dependencies = Object.entries(report.dependencies || {}).map(([name, item]) =>
              `| ${name} | ${item.installed || "unknown"} | ${item.supported || "unknown"} |`
            );
            const failedCapabilities = (report.capabilities || [])
              .filter(item => ["drift", "failed"].includes(item.compatibility))
              .map(item =>
                `- ${item.capability} (RPC ${item.rpc_id}): ${item.error_code || item.outcome}; ` +
                `stage=${item.parser_stage}; HTTP=${item.status_code ?? "n/a"}; reject=${item.reject_code ?? "n/a"}`
              );
            const failure = report.failure
              ? `- Report failure: ${report.failure.error_code} at ${report.failure.stage}`
              : "- Report failure: none";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "## Automated Gemini Web compatibility canary",
              "",
              `- Status: **${report.status}**`,
              `- Commit: \`${report.repository_commit || context.sha}\``,
              `- Workflow run: [${context.runId}](${runUrl})`,
              `- Web build: \`${report.web?.build_label || "unavailable"}\``,
              `- Locale: \`${report.web?.locale || "unavailable"}\``,
              failure,
              "",
              "### Dependency matrix",
              "",
              "| Dependency | Installed | Supported |",
              "|---|---:|---|",
              ...(dependencies.length ? dependencies : ["| unavailable | unknown | unknown |"]),
              "",
              "### Actionable capability failures",
              "",
              ...(failedCapabilities.length ? failedCapabilities : ["- None"]),
              "",
              "The workflow artifact contains only the schema-bounded sanitized report; raw responses, account content, credentials, and session identifiers are omitted.",
            ].join("\n");

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);

            if (actionable) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Compatibility recovered in [workflow run ${context.runId}](${runUrl}); status=\`${report.status}\`.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
      - name: Enforce canary result after issue reporting
        if: steps.canary.outcome == 'failure'
        run: exit 1
