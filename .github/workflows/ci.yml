name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GEMINI_AUTO_REFRESH: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Ruff and repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Ruff — syntax, imports, and undefined names
        run: python -m ruff check src tests scripts
      - name: Dependency and version contracts
        run: |
          python scripts/check_dependency_contract.py
          python scripts/check_version_consistency.py

  type:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install type-check environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Mypy — runtime and maintenance scripts
        run: python -m mypy src scripts

  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Run complete offline suite
        run: python -m pytest -q

  contracts:
    name: Targeted architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install contract environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Run targeted architecture contract checklist
        run: python scripts/run_contract_checklist.py

  protocol:
    name: Profile and MCP stdio smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install protocol smoke environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Snapshot representative full and compact profiles
        run: python scripts/smoke_profiles.py
      - name: Initialize and list tools over real MCP stdio
        run: python scripts/smoke_mcp_protocol.py

  skills:
    name: Agent Skill validation and repository install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned reference validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
          python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"
      - name: Validate public Agent Skills
        run: |
          skills-ref validate .agents/skills/gemini-web-mcp-development
          skills-ref validate .agents/skills/gemini-web-mcp
          skills-ref validate .agents/skills/gemini-assist
      - name: Install development skill directly from the repository
        run: |
          mkdir -p "$RUNNER_TEMP/development-skill-install"
          cd "$RUNNER_TEMP/development-skill-install"
          npx --cache "$RUNNER_TEMP/npm-cache" --yes skills@1.5.21 add "$GITHUB_WORKSPACE" --skill gemini-web-mcp-development --agent codex --copy --yes
          diff -ru "$GITHUB_WORKSPACE/.agents/skills/gemini-web-mcp-development" .agents/skills/gemini-web-mcp-development
      - name: Run repository skill contracts
        run: python -m pytest -q tests/test_development_skill.py tests/test_skill_packaging.py tests/test_assist_skill.py

  package:
    name: Build and clean-wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Build wheel, sdist, and standalone skill
        run: python scripts/package_release.py --outdir dist
      - name: Verify generated asset names and wheel metadata
        run: python scripts/check_version_consistency.py --artifacts-dir dist
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Verify one-command onboarding in an isolated uv environment
        working-directory: ${{ runner.temp }}
        run: uvx --from "$GITHUB_WORKSPACE"/dist/*.whl gemini-mcp-onboarding
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/gemini-wheel-smoke"
          "$RUNNER_TEMP/gemini-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/gemini-wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/gemini-wheel-smoke/bin/python" -m pip check
      - name: Smoke installed resources, entrypoints, and profiles
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gemini-wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py"
          "$RUNNER_TEMP/gemini-wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_profiles.py"
      - name: Smoke installed MCP stdio protocol
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gemini-wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_mcp_protocol.py"
      - name: Upload verified distributions for inspection
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
